services:

  # on-the-fly NVS server
  on-the-fly-nvs:
    build: .
    image: on-the-fly-nvs:latest
    runtime: nvidia
    ports:
      - "0.0.0.0:2222:22"
      - "0.0.0.0:6009:6009"
      - "0.0.0.0:8000:8000"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      - STREAM_URL=${STREAM_URL:-}
      - MODEL_PATH=${MODEL_PATH:-/app/results}
      - MODELS_DIR=/app/models
      - SSH_PUBLIC_KEY=${SSH_PUBLIC_KEY:-}
      - CCCL_IGNORE_DEPRECATED_CPP_DIALECT=1
      - GEOMETRY_PROVIDER=${GEOMETRY_PROVIDER:-r3}
      - R3_CHECKPOINT=${R3_CHECKPOINT:-r3}
      - R3_RESOLUTION=${R3_RESOLUTION:-504}
      - R3_BANK_SIZE=${R3_BANK_SIZE:-8}
      - MAX_ACTIVE_KEYFRAMES=${MAX_ACTIVE_KEYFRAMES:-40}
      # Used only with GEOMETRY_PROVIDER=default (legacy frontend).
      - DEPTH_MODEL=${DEPTH_MODEL:-vitb}
      # Downsampling factor: higher = smaller image = faster (1.5 default, try 2.0 or 3.0)
      - DOWNSAMPLING=${DOWNSAMPLING:-1.5}
      # HuggingFace mirror for faster model download in China
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      # FFmpeg auto-reconnect for MJPEG HTTP stream (IP Camera Lite uses HTTP/1.0)
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=reconnect;1|reconnect_streamed;1|reconnect_delay_max;2|timeout;60000000
    volumes:
      - ${MODELS_DIR:-./models}:/app/models
      - cupy_cache:/root/.cupy
      - ./results:/app/results
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  cupy_cache:
